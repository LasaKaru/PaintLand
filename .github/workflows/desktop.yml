# Windows desktop app on every push: a hardened Electron build (installer + portable .exe),
# SHA-256 checksums and signed build provenance. Tags like v1.2.3 publish a GitHub Release.
# Optional code signing: add the WIN_CSC_LINK (base64 .pfx) and WIN_CSC_KEY_PASSWORD secrets.
# Also a Microsoft Store package (.appx), unsigned (the Store signs it): set the
# MS_STORE_IDENTITY_NAME, MS_STORE_PUBLISHER and MS_STORE_PUBLISHER_DISPLAY_NAME repository
# variables from Partner Center (docs/MICROSOFT_STORE.md).
name: Desktop app (Windows)

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths-ignore: ['**/*.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF#refs/tags/v}"; else v="0.1.${GITHUB_RUN_NUMBER}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Build the game
        run: npm run build
        env:
          VITE_API_BASE: ${{ vars.INKROADS_API_BASE || vars.PAINTLAND_API_BASE }}
          INKROADS_VERSION: ${{ steps.version.outputs.version }}
          VITE_SERVER_WS: ${{ vars.INKROADS_SERVER_WS || vars.PAINTLAND_SERVER_WS }}
      - name: Desktop shell tests
        working-directory: desktop
        run: |
          npm ci
          npm test
          npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version
      - name: Package (NSIS installer + portable)
        working-directory: desktop
        run: npm run dist
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - name: Check the security fuses in the .exe
        working-directory: desktop
        shell: bash
        run: |
          npx @electron/fuses read --app release/win-unpacked/Inkroads.exe | tee fuses.txt
          grep -q "RunAsNode is Disabled" fuses.txt
          grep -q "EnableNodeCliInspectArguments is Disabled" fuses.txt
          grep -q "OnlyLoadAppFromAsar is Enabled" fuses.txt
          grep -q "EnableEmbeddedAsarIntegrityValidation is Enabled" fuses.txt
      - name: Checksums
        working-directory: desktop/release
        shell: pwsh
        run: Get-ChildItem *.exe | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Out-File -Encoding ascii SHA256SUMS.txt
      - name: Build provenance (verifiable with `gh attestation verify`)
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: desktop/release/*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Inkroads-Windows-${{ steps.version.outputs.version }}
          path: |
            desktop/release/*.exe
            desktop/release/SHA256SUMS.txt
          retention-days: 30
      # After the .exe is safely uploaded: the same app as a Store package.
      - name: Package for the Microsoft Store (.appx)
        working-directory: desktop
        shell: bash
        env:
          ID_NAME: ${{ vars.MS_STORE_IDENTITY_NAME }}
          PUBLISHER: ${{ vars.MS_STORE_PUBLISHER }}
          PUBLISHER_NAME: ${{ vars.MS_STORE_PUBLISHER_DISPLAY_NAME }}
        run: |
          npm run store-assets
          args=()
          [ -n "$ID_NAME" ] && args+=("-c.appx.identityName=$ID_NAME")
          [ -n "$PUBLISHER" ] && args+=("-c.appx.publisher=$PUBLISHER")
          [ -n "$PUBLISHER_NAME" ] && args+=("-c.appx.publisherDisplayName=$PUBLISHER_NAME")
          if [ -z "$ID_NAME" ] || [ -z "$PUBLISHER" ]; then
            echo "::warning title=Microsoft Store::Store identity variables not set: this .appx uses placeholder identity and Partner Center will not accept it. See docs/MICROSOFT_STORE.md."
          fi
          npx electron-builder --win appx --x64 --publish never "${args[@]}"
          ls -la release/*.appx
      - uses: actions/upload-artifact@v4
        with:
          name: Inkroads-MicrosoftStore-${{ steps.version.outputs.version }}
          path: desktop/release/*.appx
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Inkroads-Windows-${{ needs.build.outputs.version }}
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/SHA256SUMS.txt
          generate_release_notes: true
