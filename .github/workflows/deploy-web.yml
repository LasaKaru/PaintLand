# Web game on GitHub Pages: `main` is the live site; every pull request from this
# repository gets its own preview at …/previews/pr-<number>/ (removed when closed).
# One-time setup: Settings → Pages → Deploy from a branch → gh-pages / (root).
name: Web deploy and previews

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: true

jobs:
  deploy:
    # Forks get no write token and no preview (never run untrusted code with secrets).
    if: github.event_name != 'pull_request' || (github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # Point the static site at your game server (admin, branding, multiplayer), if you host one.
          VITE_API_BASE: ${{ vars.INKROADS_API_BASE || vars.PAINTLAND_API_BASE }}
          VITE_SERVER_WS: ${{ vars.INKROADS_SERVER_WS || vars.PAINTLAND_SERVER_WS }}
      - name: Publish the live site
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
          clean: true
          clean-exclude: previews/**
      - name: Publish the preview
        if: github.event_name == 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
          target-folder: previews/pr-${{ github.event.pull_request.number }}
          clean: true
      - name: Link the preview on the pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const url = `https://${owner.toLowerCase()}.github.io/${repo}/previews/pr-${context.issue.number}/`;
            const marker = '<!-- paintland-preview -->';
            const body = `${marker}\n🎨 **Preview:** ${url}\n\nBuilt from ${context.sha.slice(0, 7)}. Single-player works everywhere; multiplayer and the admin panel need the game server.`;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number: context.issue.number });
            const old = comments.find((c) => c.body?.includes(marker));
            if (old) await github.rest.issues.updateComment({ owner, repo, comment_id: old.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number: context.issue.number, body });

  cleanup:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: gh-pages
      - name: Remove the preview
        run: |
          dir="previews/pr-${{ github.event.pull_request.number }}"
          if [ -d "$dir" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git rm -rq "$dir"
            git commit -m "Remove preview for PR #${{ github.event.pull_request.number }}"
            git push
          fi
