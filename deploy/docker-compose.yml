# Inkroads on your own server with automatic HTTPS (Caddy + Let's Encrypt).
#
#   cd deploy
#   cp .env.example .env        # set DOMAIN, EMAIL and ADMIN_PASSWORD
#   docker compose up -d        # builds the game image and starts both
#
# Point your domain's DNS (A/AAAA records) at the server first, and open ports
# 80 and 443. Caddy fetches and renews the certificate on its own. The game
# server is never exposed directly: only Caddy talks to it, over the private
# compose network.
name: paintland

services:
  paintland:
    build:
      context: ..
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
    # Or use the image CI publishes instead of building here:
    # image: ghcr.io/lasakaru/paintland:main
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "8787"
      DATA_DIR: /data
      # Caddy is the one trusted proxy: rate limits use the address it saw.
      TRUST_PROXY: "1"
      # Optional: replaces the built-in admin password on first start.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      MAX_ROOM: ${MAX_ROOM:-}
    volumes:
      - paintland-data:/data
    expose:
      - "8787"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    pids_limit: 256
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  caddy:
    image: ${CADDY_IMAGE:-caddy:2-alpine}
    restart: unless-stopped
    depends_on: [paintland]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in deploy/.env}
      EMAIL: ${EMAIL:?set EMAIL in deploy/.env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  paintland-data:
  caddy-data:
  caddy-config:
