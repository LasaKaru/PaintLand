# Inkroads on your own server with automatic HTTPS (Caddy + Let's Encrypt).
#
#   cd deploy
#   cp .env.example .env        # set DOMAIN, EMAIL and ADMIN_PASSWORD
#   docker compose up -d        # builds the game image and starts both
#
# Point your domain's DNS (A/AAAA records) at the server first, and open ports
# 80 and 443. Caddy fetches and renews the certificate on its own. The game
# server is never exposed directly: only Caddy talks to it, over the private
# compose network.
name: paintland

services:
  paintland:
    build:
      context: ..
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
    # Or use the image CI publishes instead of building here:
    # image: ghcr.io/lasakaru/paintland:main
    restart: unless-stopped
    # Never root inside the container (the image can also start as root and drop it).
    user: node
    environment:
      NODE_ENV: production
      PORT: "8787"
      DATA_DIR: /data
      # Caddy is the one trusted proxy: rate limits use the address it saw.
      TRUST_PROXY: "1"  # one proxy (Caddy) in front
      # Optional: replaces the built-in admin password on first start.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      MAX_ROOM: ${MAX_ROOM:-}
      # Voice chat relay (optional, see the turn service below).
      TURN_URLS: ${TURN_URLS:-}
      TURN_SECRET: ${TURN_SECRET:-}
    volumes:
      - paintland-data:/data
    expose:
      - "8787"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    pids_limit: 256
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  caddy:
    image: ${CADDY_IMAGE:-caddy:2-alpine}
    restart: unless-stopped
    depends_on: [paintland]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in deploy/.env}
      EMAIL: ${EMAIL:?set EMAIL in deploy/.env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Voice chat relay (TURN) for players whose networks block direct links.
  # Off unless started with:  docker compose --profile voice up -d
  # It needs UDP ports 3478 and 49160-49200 open on the server's firewall.
  turn:
    image: ${TURN_IMAGE:-coturn/coturn:4.6}
    profiles: [voice]
    restart: unless-stopped
    network_mode: host
    command:
      - -n
      - --log-file=stdout
      - --realm=${DOMAIN}
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET:?set TURN_SECRET in deploy/.env to use voice relay}
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      - --fingerprint
      - --no-cli
      - --no-multicast-peers
      - --no-tlsv1
      - --no-tlsv1_1
      # Only relay voice between players: never into private or local networks.
      - --denied-peer-ip=0.0.0.0-0.255.255.255
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=100.64.0.0-100.127.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      - --denied-peer-ip=::1
      - --denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
      - --denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
      - --user-quota=12
      - --total-quota=1200
      - --max-bps=64000
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  paintland-data:
  caddy-data:
  caddy-config:
